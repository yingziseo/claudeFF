<script>
const $=s=>document.querySelector(s),names={privacy:'隐私防护',network:'网络连接',telemetry:'数据偏好',verify:'防护验证'},cache={};let current='';
function render(name){if(!names[name])return;if(current){cache[current]=document.createDocumentFragment();while($('#content').firstChild)cache[current].append($('#content').firstChild)}current=name;$('#content').replaceChildren(cache[name]||document.getElementById(name).content.cloneNode(true));$('#crumb').textContent=names[name];document.querySelectorAll('nav [data-tab]').forEach(b=>b.dataset.tab===name?b.setAttribute('aria-current','page'):b.removeAttribute('aria-current'));$('#footer-actions').innerHTML=name==='privacy'?'<button class="btn" data-tab="verify">验证防护</button><button class="btn primary" data-demo>开启防护</button>':name==='verify'?'<button class="btn primary" data-demo>验证防护</button>':'<button class="btn" data-tab="privacy">返回隐私防护</button>';$('#message').textContent='预览模式 · 尚未开启防护'}
render('privacy');
document.addEventListener('change',e=>{if(e.target.id==='managed')$('#proxy-form').hidden=!e.target.checked});
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.tab)render(b.dataset.tab);if(b.hasAttribute('data-demo'))$('#message').textContent='请在 Windows 版执行此操作。预览没有修改配置或生成验证结果。';if(b.id==='preview-info')$('#message').textContent='可体验导航、主题和设置展开。网页不连接 Windows，不执行防护。';if(b.id==='parse-proxy'){try{let raw=$('#proxy-paste').value.trim();const u=new URL(raw.includes('://')?raw:'socks5://'+raw);if(u.protocol!=='socks5:'||!u.hostname||!u.port||+u.port<1||+u.port>65535||(u.pathname&&u.pathname!=='/')||u.search||u.hash)throw Error();$('#host').value=u.hostname;$('#port').value=u.port;$('#username').value=decodeURIComponent(u.username);$('#password').value=decodeURIComponent(u.password);$('#auth').open=!!u.username;$('#proxy-paste').value='';$('#proxy-message').textContent='已填入，仅保存在本次预览页面，尚未连接。'}catch{$('#proxy-message').textContent='请填写 socks5://用户名:密码@主机:端口，或 主机:端口。'}}});
$('#theme').onclick=()=>{const light=document.documentElement.dataset.theme!=='light';document.documentElement.dataset.theme=light?'light':'dark';$('#theme span').textContent=light?'切换深色外观':'切换浅色外观';$('#theme').setAttribute('aria-label',$('#theme span').textContent)};
</script></body></html>
