name: Windows build and native launch
on:
  workflow_dispatch:
  push:
    paths: ['src/**', 'tests/**', 'scripts/**', 'docs/**', '*.props', '*.sln', 'global.json', '.github/workflows/**']
  pull_request:
concurrency:
  group: windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'global.json') }}
          restore-keys: nuget-${{ runner.os }}-
      - name: Compile, test, publish and start the actual EXE
        shell: pwsh
        run: ./scripts/package.ps1
      - name: Upload native startup evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-ui-${{ matrix.os }}
          path: artifacts/native-ui/
          if-no-files-found: warn
      - name: Upload verified Windows package
        uses: actions/upload-artifact@v4
        with:
          name: claudeFF-v0.1.2-${{ matrix.os }}
          path: artifacts/claudeFF-win-x64-v0.1.2.zip
          if-no-files-found: error
