name: License service and panel
on:
  push:
    branches: [main]
    paths: ['internal/licensing/**', 'cmd/license-server/**', 'frontend/**', 'go.*', '.github/workflows/licensing.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: licensing-${{ github.ref }}
  cancel-in-progress: true
jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VITE_ADMIN_DEMO: '0'
      CLAUDEFF_CI_LICENSE: '1'
      CLAUDEFF_ADMIN_TOKEN: 'cloud-test-fixture-not-a-production-admin-token'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
          cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: go mod tidy
      - run: go test -race ./internal/licensing
      - run: go build -trimpath -o build/license-server ./cmd/license-server
        env:
          CGO_ENABLED: '0'
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: sudo apt-get install -y fonts-noto-cjk
      - run: npx playwright test --config playwright.license.config.ts
        working-directory: frontend
      - name: Package service and panel
        run: |
          mkdir -p release/frontend
          cp build/license-server release/
          cp -r frontend/dist release/frontend/
          cp docs/授权服务运行说明.md release/README.md
          tar -czf claudeFF-license-linux-x64.tar.gz -C release .
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: license-service
          retention-days: 30
          path: |
            claudeFF-license-linux-x64.tar.gz
            frontend/license-report/
            frontend/test-results/
            go.mod
            go.sum
