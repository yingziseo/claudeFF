name: Windows portable client
on:
  push:
    branches: [main]
    paths: ['*.go', 'go.*', 'wails.json', 'build/**', 'internal/**', 'cmd/**', 'scripts/**', 'frontend/**', '.github/workflows/windows.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      CLAUDEFF_DESKTOP: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
          cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: go mod tidy
      - run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.16.0
      - run: wails build -platform windows/amd64 -skipbindings -s
      - run: python build/download-runtime.py
      - name: Validate fixed Microsoft runtime signature
        shell: pwsh
        run: |
          $exe = 'build/bin/webview2/msedgewebview2.exe'
          $signature = Get-AuthenticodeSignature $exe
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch 'Microsoft') { throw 'Fixed runtime signature verification failed' }
      - run: go test ./internal/...
      - run: go test .
      - name: Actual kernel, authenticated proxy, stable data and tab restoration
        env:
          CLAUDEFF_KERNEL_SMOKE: '1'
          CLAUDEFF_KERNEL_DIR: '${{ github.workspace }}/build/bin/browser'
        run: go test -v ./internal/browser -run TestWindowsFingerprintKernel -timeout 10m
      - name: Official native Code installation and ConPTY
        env:
          CLAUDEFF_CODE_SMOKE: '1'
        run: go test -v ./internal/code -run TestOfficialNative -timeout 15m
      - name: Real Wails window, clipboard, user proxy and bundled Chromium
        env:
          CLAUDEFF_TEST_PROXY: '${{ secrets.CLAUDEFF_TEST_PROXY }}'
        run: node frontend/tests/native-windows.mjs
      - name: Package complete portable ZIP
        shell: pwsh
        run: |
          Copy-Item docs/Windows运行说明.md build/bin/README.md
          Copy-Item docs/第三方许可与来源.md build/bin/THIRD-PARTY.md
          python build/collect-notices.py build/bin/DEPENDENCY-NOTICES.txt
          if ($LASTEXITCODE -ne 0) { throw 'Dependency notices collection failed' }
          python build/package.py build/bin claudeFF-windows-x64.zip
          if ($LASTEXITCODE -ne 0) { throw 'Packaging failed' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-client
          compression-level: 0
          retention-days: 30
          path: |
            claudeFF-windows-x64.zip
            claudeFF-windows-x64.sha256
            build/bin/RUNTIMES.json
            go.mod
            go.sum
            native-evidence/
