name: Core validation
on:
  push:
    branches: [main]
    paths: ['internal/**', 'cmd/**', 'scripts/**', 'go.*', '.github/workflows/core.yml']
  pull_request:
    paths: ['internal/**', 'cmd/**', 'scripts/**', 'go.*', '.github/workflows/core.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: core-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
          cache: false
      - name: Resolve initial module lock in cloud
        run: go mod tidy
      - name: Format and test core
        run: |
          test -z "$(gofmt -l internal cmd)"
          go test -race ./internal/...
      - name: Check sandbox syntax
        run: bash -n scripts/sandbox/*.sh
      - name: Exercise whole-process isolation in Linux cloud
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y bubblewrap iptables
          sudo useradd --create-home --shell /bin/bash claudeff
          sudo mkdir -p /opt/claudeff /workspace
          sudo chown claudeff:claudeff /workspace
          sudo cp scripts/sandbox/launch.sh /opt/claudeff/launch.sh
          sudo chmod 755 /opt/claudeff/launch.sh
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          sudo bash scripts/sandbox/ci-test.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: go-module-lock
          path: |
            go.mod
            go.sum
