name: Publish verified portable packages
on:
  workflow_dispatch:
    inputs:
      windows_run:
        description: Successful Windows workflow run ID
        required: true
      macos_run:
        description: Successful macOS workflow run ID
        required: true
      core_run:
        description: Successful core workflow run ID
        required: true
      frontend_run:
        description: Successful frontend workflow run ID
        required: true
      license_run:
        description: Successful license workflow run ID
        required: true
      tag:
        description: New prerelease tag
        required: true
        default: v0.3.0-dev.1
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      WINDOWS_RUN: ${{ inputs.windows_run }}
      MACOS_RUN: ${{ inputs.macos_run }}
      CORE_RUN: ${{ inputs.core_run }}
      FRONTEND_RUN: ${{ inputs.frontend_run }}
      LICENSE_RUN: ${{ inputs.license_run }}
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@v7
      - name: Verify source runs, download and validate packages, then publish
        run: python3 build/publish.py
