name: macOS native client
on:
  push:
    branches: [main]
    paths: ['*.go', 'go.*', 'wails.json', 'build/**', 'internal/**', 'frontend/**', '.github/workflows/macos.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: true
jobs:
  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            arch: amd64
            name: intel
          - runner: macos-15
            arch: arm64
            name: apple-silicon
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
          cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: go mod tidy
      - run: go test ./internal/...
      - name: Actual native official Code and PTY
        env:
          CLAUDEFF_CODE_SMOKE: '1'
        run: go test -v ./internal/code -run TestOfficialNative -timeout 15m
      - run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.16.0
      - run: wails build -platform darwin/${{ matrix.arch }} -skipbindings -s
      - name: Bundle complete official fingerprint Chromium
        if: matrix.arch == 'arm64'
        run: |
          curl --fail --location --retry 3 'https://github.com/adryfish/fingerprint-chromium/releases/download/148.0.7778.215/ungoogled-chromium_148.0.7778.215-1.1_macos.dmg' -o "$RUNNER_TEMP/kernel.dmg"
          printf '%s  %s\n' b72f091e2e1a7583eed389c4b8e3534ed355e568af8c8bbf8fc30a25e23ca679 "$RUNNER_TEMP/kernel.dmg" | shasum -a 256 -c -
          mkdir -p "$RUNNER_TEMP/kernel-mount"
          hdiutil attach "$RUNNER_TEMP/kernel.dmg" -mountpoint "$RUNNER_TEMP/kernel-mount" -nobrowse -readonly
          mkdir -p build/bin/claudeFF.app/Contents/MacOS/browser
          ditto "$RUNNER_TEMP/kernel-mount/Chromium.app" build/bin/claudeFF.app/Contents/MacOS/browser/Chromium.app
          hdiutil detach "$RUNNER_TEMP/kernel-mount"
          file build/bin/claudeFF.app/Contents/MacOS/browser/Chromium.app/Contents/MacOS/Chromium
          build/bin/claudeFF.app/Contents/MacOS/browser/Chromium.app/Contents/MacOS/Chromium --version
      - name: Actual Apple Silicon browser, exit and conversation restoration
        if: matrix.arch == 'arm64'
        env:
          CLAUDEFF_KERNEL_SMOKE: '1'
          CLAUDEFF_KERNEL_DIR: '${{ github.workspace }}/build/bin/claudeFF.app/Contents/MacOS/browser'
        run: go test -v ./internal/browser -run TestFingerprintKernel -timeout 10m
      - name: macOS GUI process smoke
        run: |
          build/bin/claudeFF.app/Contents/MacOS/claudeFF &
          app_pid=$!
          sleep 8
          kill -0 "$app_pid"
          kill "$app_pid"
      - name: Package macOS app preserving links and executable permissions
        run: |
          CopyDestination=build/bin
          cp docs/macOS运行说明.md "$CopyDestination/README.md"
          cp docs/第三方许可与来源.md "$CopyDestination/THIRD-PARTY.md"
          python3 build/collect-notices.py "$CopyDestination/DEPENDENCY-NOTICES.txt"
          ditto -c -k --sequesterRsrc build/bin claudeFF-macos-${{ matrix.name }}.zip
          shasum -a 256 claudeFF-macos-${{ matrix.name }}.zip > claudeFF-macos-${{ matrix.name }}.sha256
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-${{ matrix.name }}
          compression-level: 0
          retention-days: 30
          path: |
            claudeFF-macos-${{ matrix.name }}.zip
            claudeFF-macos-${{ matrix.name }}.sha256
            go.mod
            go.sum
